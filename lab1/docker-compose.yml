# =============================================================================
# Docker Compose configuration for Movie Rating Prediction API
# DDM501 - Lab 1: First ML Product
# =============================================================================

version: '3.8'

services:
  # ---------------------------------------------------------------------------
  # API service
  # ---------------------------------------------------------------------------
  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models
    environment:
      - MODEL_PATH=/app/models/svd_model.pkl
      - MODEL_VERSION=1.0.0
    restart: unless-stopped

